plugins {
    id 'com.android.application'
}

android {
    namespace 'com.clause.motovoid'
    compileSdk 34

    defaultConfig {
        applicationId 'com.clause.motovoid23'
        minSdk 9          // Android 2.3 (Gingerbread)
        targetSdk 23
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
